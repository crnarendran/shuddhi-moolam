name: Deploy Cloud Functions

on:
  push:
    branches:
      - main
      - staging
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check for Firebase Service Account Secret
        id: check_secret
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SAI_SHUDDHI_MOOLAM }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "Missing FIREBASE_SERVICE_ACCOUNT_SAI_SHUDDHI_MOOLAM secret. Skipping deployment."
            echo "has_secret=false" >> $GITHUB_OUTPUT
          else
            echo "has_secret=true" >> $GITHUB_OUTPUT
          fi

      - name: Checkout code
        if: steps.check_secret.outputs.has_secret == 'true'
        uses: actions/checkout@v4

      - name: Set up Node.js
        if: steps.check_secret.outputs.has_secret == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'functions/package-lock.json'

      - name: Install dependencies
        if: steps.check_secret.outputs.has_secret == 'true'
        working-directory: ./functions
        run: npm ci

      - name: Run linter
        if: steps.check_secret.outputs.has_secret == 'true'
        working-directory: ./functions
        run: npm run lint

      - name: Build
        if: steps.check_secret.outputs.has_secret == 'true'
        working-directory: ./functions
        run: |
          sed -i "s/process.env.APP_ENV || 'dev'/('${{ github.ref_name }}' as string)/g" src/index.ts
          npm run build

      - name: Test
        if: steps.check_secret.outputs.has_secret == 'true'
        working-directory: ./functions
        run: npm test

      - name: Build Dashboard
        if: steps.check_secret.outputs.has_secret == 'true'
        working-directory: ./dashboard
        run: |
          npm ci
          npm run build -- --mode ${{ github.ref_name }}

      - name: Deploy to Firebase
        if: steps.check_secret.outputs.has_secret == 'true'
        run: |
          echo "MASTER_SHEET_ID=1DNB8wkqGiVZ1fED4tSVI43PdNY6cY9NdYO6HsZJ-hoY" > functions/.env
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_SAI_SHUDDHI_MOOLAM }}' > sa.json
          export GOOGLE_APPLICATION_CREDENTIALS=$(pwd)/sa.json
          npx firebase-tools deploy --only functions,firestore --project sai-shuddhi-moolam --force
          
          if [ "${{ github.ref_name }}" = "main" ]; then
            npx firebase-tools deploy --only hosting:sai-shuddhi-moolam --project sai-shuddhi-moolam --force
          elif [ "${{ github.ref_name }}" = "staging" ]; then
            npx firebase-tools deploy --only hosting:sai-shuddhi-moolam-staging --project sai-shuddhi-moolam --force
          else
            npx firebase-tools deploy --only hosting:sai-shuddhi-moolam-dev --project sai-shuddhi-moolam --force
          fi
          
          rm sa.json

