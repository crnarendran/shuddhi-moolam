name: Deploy Cloud Functions

on:
  push:
    branches:
      - main
      - staging
      - dev

jobs:
  deploy:
    if: vars.CI_PROVIDER != 'cloudbuild'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'functions/package-lock.json'

      - name: Deploy via neutral runner
        env:
          FIREBASE_SERVICE_ACCOUNT_SAI_SHUDDHI_MOOLAM: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SAI_SHUDDHI_MOOLAM }}
        run: node scripts/ci/run.mjs deploy "${{ github.ref_name }}"
