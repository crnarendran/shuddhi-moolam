name: Sync Docs to Portal

# Pushes this repo's own docs (README, AGENTS.md, docs/, knowledge/,
# .agents/skills/*/SKILL.md) into the shared docs-portal's Firestore, tagged
# project:'shuddhi-moolam', so they render at /shuddhi-moolam/... there.
#
#   push to staging -> portal_docs      (env=staging)
#   push to dev     -> portal_docs_dev  (env=dev)
#
# Requires a repo secret holding a Firebase service account JSON key with
# Firestore write access to docs-portal-staging (and docs-portal-prod for the
# manual prod run). See knowledge/infrastructure.md for how to provision one —
# this workflow does not create it. Until the secret exists the job SKIPS (see
# the `if:` guard) rather than failing red on every push. A new page also needs
# a one-time docs-portal redeploy before its route exists — see that same doc.

on:
  push:
    branches:
      - staging
      - dev
    paths:
      - 'README.md'
      - 'AGENTS.md'
      - 'docs/**'
      - 'knowledge/**'
      - 'planning/**'
      - '.agents/skills/**'
      - 'scripts/syncDocs.ts'
      - '.github/workflows/sync-docs.yml'
  workflow_dispatch:
    inputs:
      target:
        description: 'Which docs-portal project to sync to'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - prod

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    # `secrets` is not available in a job-level `if:`, so surface presence as a
    # job-level env var (which CAN read secrets) and gate the steps on it. Until
    # the secret is provisioned the steps skip and the job stays green. A manual
    # run always proceeds.
    env:
      HAS_STAGING_SECRET: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DOCS_PORTAL_STAGING != '' }}
    steps:
      - if: ${{ env.HAS_STAGING_SECRET == 'true' || github.event_name == 'workflow_dispatch' }}
        uses: actions/checkout@v4
      - if: ${{ env.HAS_STAGING_SECRET == 'true' || github.event_name == 'workflow_dispatch' }}
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - if: ${{ env.HAS_STAGING_SECRET == 'true' || github.event_name == 'workflow_dispatch' }}
        run: npm install
      - name: Sync docs
        if: ${{ env.HAS_STAGING_SECRET == 'true' || github.event_name == 'workflow_dispatch' }}
        env:
          FIREBASE_SERVICE_ACCOUNT_STAGING: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DOCS_PORTAL_STAGING }}
          FIREBASE_SERVICE_ACCOUNT_PROD: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DOCS_PORTAL_PROD }}
        run: |
          # A manual prod run targets docs-portal-prod / portal_docs. Otherwise
          # derive the env from the branch that triggered the push: dev writes
          # the dev preview collection, staging writes the live collection.
          TARGET="${{ github.event.inputs.target || '' }}"
          if [ "$TARGET" = "prod" ]; then
            echo "$FIREBASE_SERVICE_ACCOUNT_PROD" > /tmp/sa.json
            PROJECT_ID="docs-portal-prod"
            ENV="staging"
          else
            echo "$FIREBASE_SERVICE_ACCOUNT_STAGING" > /tmp/sa.json
            PROJECT_ID="docs-portal-staging"
            if [ "${{ github.ref_name }}" = "dev" ]; then ENV="dev"; else ENV="staging"; fi
          fi
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json
          npm run sync:docs -- --env=$ENV --project-id=$PROJECT_ID
