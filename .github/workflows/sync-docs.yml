name: Sync Docs to Portal

# Pushes this repo's own docs (README, AGENTS.md, docs/, knowledge/,
# .agents/skills/*/SKILL.md) into the shared docs-portal's Firestore, tagged
# project:'shuddhi-moolam', so they render at /shuddhi-moolam/... there.
#
#   push to staging -> portal_docs      (env=staging)
#   push to dev     -> portal_docs_dev  (env=dev)
#
# Delegated to provider-neutral `scripts/ci/run.mjs sync-docs`.

on:
  push:
    branches:
      - staging
      - dev
    paths:
      - 'README.md'
      - 'AGENTS.md'
      - 'docs/**'
      - 'knowledge/**'
      - 'planning/**'
      - '.agents/skills/**'
      - 'scripts/syncDocs.ts'
      - '.github/workflows/sync-docs.yml'
  workflow_dispatch:
    inputs:
      target:
        description: 'Which docs-portal project to sync to'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - prod

jobs:
  sync-docs:
    if: vars.CI_PROVIDER != 'cloudbuild'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Sync docs via neutral runner
        env:
          DOCS_TARGET: ${{ github.event.inputs.target || '' }}
          FIREBASE_SERVICE_ACCOUNT_DOCS_PORTAL_STAGING: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DOCS_PORTAL_STAGING }}
          FIREBASE_SERVICE_ACCOUNT_DOCS_PORTAL_PROD: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DOCS_PORTAL_PROD }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ secrets.DOCS_PORTAL_DISPATCH_TOKEN }}
        run: node scripts/ci/run.mjs sync-docs "${{ github.ref_name }}"
